name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which is no longer published.
          packages: platform-tools

      - name: Fetch sherpa-onnx native libs (arm64-v8a)
        run: |
          set -euo pipefail
          VER=v1.13.2
          curl -fsSL -o sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/$VER/sherpa-onnx-$VER-android.tar.bz2"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          tar xjf sherpa.tar.bz2 \
            ./jniLibs/arm64-v8a/libsherpa-onnx-jni.so \
            ./jniLibs/arm64-v8a/libonnxruntime.so
          cp jniLibs/arm64-v8a/libsherpa-onnx-jni.so \
             jniLibs/arm64-v8a/libonnxruntime.so \
             app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-whisper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifacts need a signed-in browser; a pre-release gives a plain download link:
      # https://github.com/<owner>/<repo>/releases/download/build-<branch>/phone-whisper-debug.apk
      - name: Publish APK as a pre-release for this branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME//\//-}"
          tag="build-$branch"
          cp app/build/outputs/apk/debug/app-debug.apk phone-whisper-debug.apk
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" phone-whisper-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug APK: $GITHUB_REF_NAME" \
            --notes "Debug build of $GITHUB_REF_NAME at ${GITHUB_SHA::7}. Installs next to the upstream app as \"Phone Whisper OpenAI\"."
